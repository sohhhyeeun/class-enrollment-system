spring:
  datasource:
    url: jdbc:mysql://localhost:3306/class_enrollment_test
    username: '${db.username}'
    password: '${db.password}'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        generate_statistics: true